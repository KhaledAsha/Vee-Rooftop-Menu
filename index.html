  <style>
    :root {
      --night: #2b0a15;
      --wine: #5e1327;
      --paper: #f4eaea;
      --ink: #2b0a15;
      --muted: #7b5a62;
      --line: rgba(94, 19, 39, 0.16);
      --display: "DM Serif Display", Georgia, "Times New Roman", serif;
      --sans: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-padding-top: 76px;
      background: var(--paper);
    }

    body {
      min-height: 100dvh;
      color: var(--ink);
      background: var(--paper);
      font: 400 16px/1.45 var(--sans);
      -webkit-font-smoothing: antialiased;
    }

    #top {
      position: relative;
      overflow: hidden;
      text-align: center;
      color: #f6e6e4;
      padding: calc(env(safe-area-inset-top, 0px) + 52px) 24px 0;
      background: linear-gradient(180deg, #2b0a15 0%, #5e1327 46%, #8e2a47 100%);
    }

    .sun {
      position: absolute;
      left: 50%;
      bottom: 0;
      width: min(130%, 820px);
      aspect-ratio: 2 / 1;
      border-radius: 50%;
      transform: translate(-50%, 50%);
      background: radial-gradient(closest-side, rgba(255, 214, 200, 0.8), rgba(226, 154, 165, 0.3) 55%, transparent 72%);
      animation: dawn 1.8s cubic-bezier(0.2, 0.7, 0.2, 1) both;
    }

    @keyframes dawn {
      from {
        transform: translate(-50%, 100%);
        opacity: 0;
      }
    }

    #top>*:not(.sun) {
      position: relative;
    }

    .logo {
      display: block;
      margin: 0 auto;
      width: min(30vw, 104px);
      height: auto;
      color: #f6e6e4;
    }

    .tag {
      max-width: 26ch;
      margin: 22px auto 10px;
      font: italic 400 21px/1.35 var(--display);
    }

    .hours {
      font: 500 14px var(--sans);
      color: #f0c9cf;
    }

    .skyline {
      display: block;
      width: 100%;
      height: 64px;
      margin: 34px 0 -1px;
      fill: var(--night);
    }

    nav {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--night);
      border-radius: 0 0 14px 14px;
      padding-top: env(safe-area-inset-top, 0px);
    }

    #tabs {
      display: flex;
      gap: 8px;
      max-width: 680px;
      margin: 0 auto;
      padding: 4px 16px 12px;
      overflow-x: auto;
      flex-wrap: nowrap;
      white-space: nowrap;
      scrollbar-width: none;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
    }

    #tabs::-webkit-scrollbar {
      display: none;
    }

    #tabs::before,
    #tabs::after {
      content: '';
      flex: 0 0 8px;
    }

    #tabs button {
      flex: 0 0 auto;
      font: 500 14px var(--sans);
      color: #e9cdd2;
      background: none;
      border: 1px solid rgba(244, 234, 234, 0.24);
      border-radius: 999px;
      padding: 8px 16px;
      cursor: pointer;
      touch-action: manipulation;
      transition: background 0.15s ease, color 0.15s ease;
      scroll-margin: 0 16px;
    }

    #tabs button:hover {
      background: rgba(244, 234, 234, 0.1);
    }

    #tabs button[aria-selected="true"] {
      background: var(--paper);
      border-color: var(--paper);
      color: var(--night);
    }

    :focus-visible {
      outline: 2px solid var(--wine);
      outline-offset: 2px;
    }

    nav :focus-visible {
      outline-color: var(--paper);
    }

    main {
      max-width: 600px;
      min-height: 60vh;
      margin: 0 auto;
      padding: 8px 24px calc(64px + env(safe-area-inset-bottom, 0px));
    }

    main.swap {
      animation: swap 0.28s ease-out;
    }

    @keyframes swap {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
    }

    .title {
      margin: 34px 0 4px;
      font: 400 clamp(42px, 13vw, 64px) / 1.02 var(--display);
      letter-spacing: 0;
    }

    section+section {
      margin-top: 44px;
    }

    h2 {
      margin-top: 30px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--wine);
      font: italic 400 28px/1.2 var(--display);
      color: var(--wine);
    }

    ul {
      list-style: none;
    }

    li {
      padding: 15px 0;
      border-bottom: 1px solid var(--line);
    }

    li:last-child {
      border-bottom: 0;
    }

    .row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
    }

    .name {
      font: 500 17px/1.3 var(--sans);
    }

    .price {
      flex: none;
      font: 600 16px var(--sans);
      font-variant-numeric: tabular-nums;
      color: var(--wine);
      white-space: nowrap;
    }

    .price small {
      margin-left: 4px;
      font: 500 11px var(--sans);
      color: var(--muted);
    }

    .desc {
      max-width: 44ch;
      margin-top: 4px;
      font: 400 14px/1.5 var(--sans);
      color: var(--muted);
    }

    .loading {
      padding: 48px 0;
      color: var(--muted);
      font-style: italic;
    }

    @media (prefers-reduced-motion: reduce) {

      .sun,
      main.swap {
        animation: none;
      }

      #tabs {
        scroll-behavior: auto;
      }
    }
  </style>
</head>

  <script>
    (function () {
      // Live menu: Google Sheet CSV (header: tab | category | name | price | description).
      // If the sheet fails to load, the last good copy (or the built-in menu) is used.
      var SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRkR2zMpEgjLQkdQQIzw9a5mUavE5NJEZo8Qp90iQXV-8r_O1toGtAOomYBzyzqMoJkZwWohuuLrI-Q/pub?gid=511542489&single=true&output=csv';
      var CACHE_KEY = 'vee-menu-cache-v1';
      var FETCH_TIMEOUT_MS = 4000;

      var data = JSON.parse(document.getElementById('data').textContent);
      var tabs = document.getElementById('tabs');
      var menu = document.getElementById('menu');
      var top_ = document.getElementById('top');
      var currentId = location.hash.slice(1) || null;

      function esc(s) {
        return String(s).replace(/[&<>"]/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
        });
      }

      function slug(s) {
        return String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'x';
      }

      function buildTabs() {
        tabs.innerHTML = '';
        data.forEach(function (g) {
          var b = document.createElement('button');
          b.type = 'button';
          b.setAttribute('role', 'tab');
          b.dataset.id = g.id;
          b.textContent = g.name;

          b.addEventListener('click', function () { show(g.id, true); });

          b.addEventListener('keydown', function (e) {
            var target = null;
            if (e.key === 'ArrowRight') target = b.nextElementSibling || tabs.firstElementChild;
            else if (e.key === 'ArrowLeft') target = b.previousElementSibling || tabs.lastElementChild;
            else if (e.key === 'Home') target = tabs.firstElementChild;
            else if (e.key === 'End') target = tabs.lastElementChild;
            if (target) {
              e.preventDefault();
              target.focus();
              target.click();
            }
          });

          tabs.appendChild(b);
        });
      }

      function parseCSV(text) {
        var rows = [], row = [], cell = '', q = false, i, c;
        text = text.replace(/^\uFEFF/, '');
        for (i = 0; i < text.length; i++) {
          c = text[i];
          if (q) {
            if (c === '"') {
              if (text[i + 1] === '"') { cell += '"'; i++; } else { q = false; }
            } else { cell += c; }
          } else if (c === '"') { q = true; }
          else if (c === ',') { row.push(cell); cell = ''; }
          else if (c === '\n' || c === '\r') {
            if (c === '\r' && text[i + 1] === '\n') i++;
            row.push(cell); rows.push(row); row = []; cell = '';
          } else { cell += c; }
        }
        if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
        return rows;
      }

      function csvToData(text) {
        var rows = parseCSV(text);
        var groups = [], gIndex = {};
        var start = (rows[0] && (rows[0][0] || '').trim().toLowerCase() === 'tab') ? 1 : 0;
        rows.slice(start).forEach(function (r) {
          var tab = (r[0] || '').trim(), cat = (r[1] || '').trim(), name = (r[2] || '').trim();
          if (!tab || !name) return;

          var price = (r[3] || '').replace(/[^0-9.,]/g, '').replace(',', '.');
          var desc = (r[4] || '').trim();
          var tid = slug(tab);
          var g = gIndex[tid];
          if (!g) {
            g = { id: tid, name: tab, cats: [], _c: {} };
            gIndex[tid] = g;
            groups.push(g);
          }
          var cname = cat || tab;
          var ckey = cname.toLowerCase().replace(/\s+/g, ' ');
          var c = g._c[ckey];
          if (!c) {
            c = { name: cname, items: [] };
            g._c[ckey] = c;
            g.cats.push(c);
          }
          var it = [name, price === '' ? '' : parseFloat(price), desc];
          c.items.push(it);
        });
        groups.forEach(function (g) { delete g._c; });
        return groups;
      }

      function render(d) {
        data = d;
        buildTabs();
        show(currentId, false);
      }

      function loadSheet() {
        if (!SHEET_CSV_URL) { render(data); return; }

        var ctrl = window.AbortController ? new AbortController() : null;
        var timer = ctrl ? setTimeout(function () { ctrl.abort(); }, FETCH_TIMEOUT_MS) : null;

        fetch(SHEET_CSV_URL + '&t=' + Date.now(), { cache: 'no-store', signal: ctrl ? ctrl.signal : undefined })
          .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
          .then(function (t) {
            clearTimeout(timer);
            var fresh = csvToData(t);
            if (!fresh.length) throw new Error('Empty sheet');
            try { localStorage.setItem(CACHE_KEY, JSON.stringify(fresh)); } catch (e) { }
            render(fresh);
          })
          .catch(function (err) {
            clearTimeout(timer);
            console.warn('Menu sheet not loaded, using fallback.', err);
            var cached = null;
            try { cached = JSON.parse(localStorage.getItem(CACHE_KEY)); } catch (e) { }
            render(cached && cached.length ? cached : data);
          });
      }

      function item(i) {
        var p = Number(i[1]);
        var h = '<li><div class="row"><span class="name">' + esc(i[0]) + '</span>';
        if (isFinite(p) && i[1] !== '' && i[1] !== null) {
          h += '<span class="price">' + p.toFixed(2) + '<small>JD</small></span>';
        }
        h += '</div>';
        if (i[2]) h += '<p class="desc">' + esc(i[2]) + '</p>';
        return h + '</li>';
      }

      function show(id, user) {
        var g = data.filter(function (x) { return x.id === id; })[0] || data[0];
        if (!g) return;
        currentId = g.id;
        var single = g.cats.length === 1;
        var html = '<h1 class="title">' + esc(g.name) + '</h1>';

        html += g.cats.map(function (c) {
          return '<section>' + (single ? '' : '<h2>' + esc(c.name) + '</h2>') +
            '<ul>' + c.items.map(item).join('') + '</ul></section>';
        }).join('');

        menu.innerHTML = html;
        if (user) {
          menu.classList.remove('swap');
          void menu.offsetWidth;
          menu.classList.add('swap');
        }

        Array.prototype.forEach.call(tabs.children, function (b) {
          var on = b.dataset.id === g.id;
          b.setAttribute('aria-selected', on ? 'true' : 'false');
          b.tabIndex = on ? 0 : -1;
          if (on) {
            b.scrollIntoView({ inline: 'center', block: 'nearest', behavior: user ? 'smooth' : 'auto' });
          }
        });

        if (user) {
          history.replaceState(null, '', '#' + g.id);
          var y = top_.offsetHeight;
          if (window.scrollY > y) {
            window.scrollTo({ top: y, behavior: 'smooth' });
          }
        }
      }

      loadSheet();
    })();
  </script>
</body>

</html>
