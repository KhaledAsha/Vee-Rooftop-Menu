name: Update built-in menu

# Refreshes the fallback menu inside index.html from the Google Sheet.
# Commits only when the menu changed, so Netlify deploys only on real changes.
on:
  schedule:
    - cron: '17 * * * *'   # every hour
  workflow_dispatch:       # manual run from the Actions tab

permissions:
  contents: write

concurrency:
  group: update-menu
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      # Fails (and commits nothing) if the sheet cannot be fetched or is empty.
      - name: Fetch sheet and rewrite built-in menu
        run: node update-menu.js

      - name: Commit if changed
        run: |
          if git diff --quiet -- index.html; then
            echo "No menu changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Update built-in menu from sheet"
          git push
